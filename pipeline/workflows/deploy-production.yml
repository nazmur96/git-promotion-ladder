name: Deploy to production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy, e.g. 0.1.0. Leave blank to deploy whatever main declares.'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Decide which version to deploy
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED" ]; then
            VERSION="$REQUESTED"
            echo "::warning::Manual deploy requested: $VERSION (not the version on main)"
          else
            VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            echo "This commit carries version $VERSION"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Locate the build that produced it
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=helpdesk-$VERSION" --jq '.artifacts[0].workflow_run.id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No artifact named helpdesk-$VERSION exists. That version was never built on develop."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Built by run $RUN_ID"

      - name: Download that exact artifact
        uses: actions/download-artifact@v4
        with:
          name: helpdesk-${{ steps.version.outputs.value }}
          path: dist
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify the bytes
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Deploy
        run: |
          echo "Deploying helpdesk ${{ steps.version.outputs.value }} to production"
          echo "sha256 $(cut -d' ' -f1 dist/SHA256SUMS)"
          echo "Not rebuilt - promoted from the dev build."
