# Installed from nazmur96/syndicate (templates/linkedin-token-check.yml).
# Weekly check; opens an issue when the LinkedIn token nears its 60-day expiry.
name: LinkedIn token check
on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays, 09:00 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    uses: nazmur96/syndicate/.github/workflows/linkedin-token-check.yml@v1
    secrets: inherit
